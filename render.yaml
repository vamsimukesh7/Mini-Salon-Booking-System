services:
  - type: web
    name: atelier-salon
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.lock.txt && npm ci --prefix frontend --cache /tmp/npm-cache && npm --prefix frontend run build
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: NODE_VERSION
        value: 22.16.0
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gpt-4o-mini
      - key: SALON_TIMEZONE
        value: Asia/Kolkata
